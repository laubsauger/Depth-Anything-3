# Comprehensive Benchmark Configuration
# Tests multiple models with various processing resolutions.
#
# IMPORTANT: This config uses explicit process_res values that are multiples
# of 14 (ViT patch size). See RESOLUTION_GUIDE.md for full details.
#
# Estimated time: ~30-45 min on MPS

name: "Comprehensive Streaming Benchmark"
description: "Full benchmark testing models across resolutions with proper divisibility"

# Provide your own test video for realistic results
# input_video: "path/to/test_video.mp4"

output_dir: "benchmark_results/comprehensive"

compare_against_baseline: true
baseline_scenario_name: "DA3-BASE_504"

scenarios:
  # ========================================================================
  # DA3-SMALL Tests
  # Resolution: 252, 378, 504 (all multiples of 14)
  # ========================================================================

  - name: "DA3-SMALL_252"  # Fast - 18×14
    model:
      name: "DA3-SMALL"
      model_dir: "depth-anything/DA3-SMALL"
    num_cameras: 1
    resolution: [512, 512]  # Input frame upper bound
    process_res: 252        # Actual model processing
    precision: "fp32"
    device: "mps"
    num_frames: 100
    warmup_frames: 5
    save_depth_maps: true
    save_comparison_video: true

  - name: "DA3-SMALL_378"  # Medium - 27×14
    model:
      name: "DA3-SMALL"
      model_dir: "depth-anything/DA3-SMALL"
    num_cameras: 1
    resolution: [512, 512]
    process_res: 378
    precision: "fp32"
    device: "mps"
    num_frames: 100
    warmup_frames: 10
    save_depth_maps: true
    save_comparison_video: true

  - name: "DA3-SMALL_504"  # Standard - 36×14
    model:
      name: "DA3-SMALL"
      model_dir: "depth-anything/DA3-SMALL"
    num_cameras: 1
    resolution: [512, 512]
    process_res: 504
    precision: "fp32"
    device: "mps"
    num_frames: 100
    warmup_frames: 5
    save_depth_maps: true
    save_comparison_video: true

  - name: "DA3-SMALL_756"  # Standard - 36×14
    model:
      name: "DA3-SMALL"
      model_dir: "depth-anything/DA3-SMALL"
    num_cameras: 1
    resolution: [1024, 1024]
    process_res: 756
    precision: "fp32"
    device: "mps"
    num_frames: 100
    warmup_frames: 5
    save_depth_maps: true
    save_comparison_video: true

  # ========================================================================
  # DA3-BASE Tests
  # ========================================================================

  - name: "DA3-BASE_252"
    model:
      name: "DA3-BASE"
      model_dir: "depth-anything/DA3-BASE"
    num_cameras: 1
    resolution: [512, 512]
    process_res: 252
    precision: "fp32"
    device: "mps"
    num_frames: 100
    warmup_frames: 10
    save_depth_maps: true
    save_comparison_video: true

  - name: "DA3-BASE_504"
    model:
      name: "DA3-BASE"
      model_dir: "depth-anything/DA3-BASE"
    num_cameras: 1
    resolution: [512, 512]
    process_res: 504
    precision: "fp32"
    device: "mps"
    num_frames: 100
    warmup_frames: 5
    save_depth_maps: true
    save_comparison_video: true

